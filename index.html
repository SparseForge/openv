<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Openv — Coming Soon</title>
  <meta name="description" content="Openv is coming soon.">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --accent: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --accent: #818cf8;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 0 1.5rem;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    h1 span { color: var(--accent); }
    p {
      margin: 0.75rem 0 0;
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .dots { display: inline-flex; gap: 0.35em; margin-left: 0.4em; }
    .dots i {
      width: 0.4em;
      height: 0.4em;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-0.5em); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dots i { animation: none; opacity: 0.7; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Open<span>v</span></h1>
    <p>Coming soon<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
  </main>
</body>
</html>
